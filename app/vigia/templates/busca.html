{% extends "base.html" %}
{% block conteudo %}
  <h1>Busca de municípios</h1>
  <form action="/buscar">
    <label for="q">Nome do município</label>
    <input id="q" name="q" value="{{q}}">
    <button>Buscar</button>
  </form>
  {% if q and not resultados %}
    <p>Nenhum município encontrado.</p>
  {% endif %}
  <ul>
    {% for m in resultados %}
      <li><a href="/municipio/{{m.codigo_ibge}}">{{m.nome}} ({{m.uf}})</a></li>
    {% endfor %}
  </ul>
{% endblock %}
