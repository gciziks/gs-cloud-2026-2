apiVersion: 1

groups:
  - orgId: 1
    name: Vigia
    folder: Vigia
    interval: 30s
    rules:
      - uid: mvp-fora
        title: MVP fora do ar
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="vigia"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: lt, params: [1] }, operator: { type: and }, query: { params: [C] }, reducer: { type: last }, type: query }]
              refId: C
        labels: { severidade: critica }
        annotations:
          summary: O endpoint de métricas do MVP está indisponível.
      - uid: taxa-erros
        title: Taxa de erro acima de 5%
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 100 * sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, type: reduce, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [5] }, operator: { type: and }, query: { params: [C] }, reducer: { type: last }, type: query }]
              refId: C
        labels: { severidade: aviso }
        annotations: { summary: Mais de 5% das requisições retornaram erro 5xx. }
      - uid: latencia-p95
        title: Latência p95 acima de 2s
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!="/metrics"}[5m])))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, type: reduce, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [2] }, operator: { type: and }, query: { params: [C] }, reducer: { type: last }, type: query }]
              refId: C
        labels: { severidade: aviso }
        annotations: { summary: O percentil 95 da latência passou de 2 segundos. }
      - uid: memoria-servidor
        title: Memória do servidor acima de 90%
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, type: reduce, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [90] }, operator: { type: and }, query: { params: [C] }, reducer: { type: last }, type: query }]
              refId: C
        labels: { severidade: aviso }
        annotations: { summary: O uso de memória do host passou de 90%. }
