apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy-equipe
    receivers:
      - uid: ntfy-equipe-webhook
        type: webhook
        settings:
          url: https://ntfy.sh/${NTFY_TOPICO}?template=grafana
          httpMethod: POST
          maxAlerts: 0

policies:
  - orgId: 1
    receiver: ntfy-equipe
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
