name: vigia-observability

services:
  prometheus:
    image: prom/prometheus:v3.13.3
    entrypoint: [/bin/sh, -c]
    command:
      - sed -e "s|__MVP_HOST__|$${MVP_HOST}|g" -e "s|__MVP_SCHEME__|$${MVP_SCHEME}|g" /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d --web.enable-lifecycle
    environment:
      MVP_HOST: ${MVP_HOST:?defina MVP_HOST em observability/.env}
      MVP_SCHEME: ${MVP_SCHEME:-https}
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - ./.segredos/metrics_token:/etc/prometheus/token:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD em observability/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      NTFY_TOPICO: ${NTFY_TOPICO:-}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  k6:
    image: grafana/k6:1.8.0
    profiles: [carga]
    volumes:
      - ./k6:/scripts:ro

volumes:
  prometheus_data:
  grafana_data:
